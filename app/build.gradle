plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def envFile = rootProject.file(".env")
def env = new Properties()
if (envFile.exists()) {
    envFile.withInputStream { env.load(it) }
}

android {
    namespace 'com.example.starshipmedtech'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.starshipmedtech"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        buildConfigField "String", "GEMINI_API_KEY", "\"${env.getProperty("GEMINI_API_KEY") ?: ""}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Updated to latest version
    implementation 'com.google.ai.client.generativeai:generativeai:0.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

task copyIcon(type: Copy) {
    from "${rootProject.projectDir}/ic_launcher.png"
    into "src/main/res/drawable"
}

preBuild.dependsOn(copyIcon)
